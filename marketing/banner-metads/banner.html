<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<title>Banner Meta Ads — SP500-site</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg-0: #0d0d16;
    --bg-1: #101018;
    --panel: #1a1a2e;
    --border: #2b2b42;
    --cyan: #00d4ff;
    --blue: #2f7bff;
    --green: #00e676;
    --red: #ff5252;
    --purple: #8b5cf6;
    --text: #f2f4ff;
    --text-dim: #aeb2c6;
    --text-faint: #6a6f85;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1080px; height: 1080px; overflow: hidden; }

  body {
    position: relative;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    background:
      radial-gradient(720px 480px at 16% 6%, rgba(0, 212, 255, 0.14), transparent 65%),
      radial-gradient(760px 560px at 90% 22%, rgba(139, 92, 246, 0.13), transparent 65%),
      radial-gradient(640px 420px at 8% 96%, rgba(0, 230, 118, 0.07), transparent 65%),
      linear-gradient(160deg, #12121f 0%, var(--bg-1) 42%, var(--bg-0) 100%);
    color: var(--text);
  }

  /* gresubtil + veladura para fade nas bordas */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(120, 140, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 140, 255, 0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 45%, #000 45%, transparent 100%);
            mask-image: radial-gradient(ellipse 90% 90% at 50% 45%, #000 45%, transparent 100%);
    pointer-events: none;
  }

  /* decoração: candlesticks discretos */
  .decor { position: absolute; pointer-events: none; }
  .decor.tl { top: 150px; right: 30px; opacity: 0.45; transform: scale(0.8); transform-origin: top right; }
  .decor.bl { bottom: 30px; left: 40px; opacity: 0.8; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 30px 50px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== 1. MARCA ===== */
  .brand {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-logo {
    width: 68px;
    height: 68px;
    border-radius: 16px;
    border: 1px solid rgba(0, 212, 255, 0.4);
    background: #000;
    box-shadow: 0 0 24px rgba(0, 212, 255, 0.22);
  }
  .brand-name {
    font-size: 33px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .brand-name .site { color: var(--cyan); }
  .brand-tag {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2.2px;
    color: var(--cyan);
    border: 1px solid rgba(0, 212, 255, 0.35);
    background: rgba(0, 212, 255, 0.07);
    border-radius: 999px;
    padding: 9px 18px 8px;
    white-space: nowrap;
  }

  /* ===== 2. HEADLINE ===== */
  .headline {
    margin-top: 22px;
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
    font-size: 55px;
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-align: center;
    color: var(--text);
    text-wrap: balance;
  }
  .headline .accent {
    background: linear-gradient(92deg, var(--cyan) 10%, #4da3ff 90%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
  }

  /* ===== 3. PROPOSTA DE VALOR ===== */
  .value-prop {
    margin-top: 12px;
    font-size: 21.5px;
    font-weight: 500;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.2px;
  }
  .value-prop strong { color: #dfe3f5; font-weight: 700; }

  /* ===== 4. PRODUTO (screenshot real) ===== */
  .hero {
    margin-top: 20px;
    width: 924px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #141425;
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      0 0 44px rgba(0, 212, 255, 0.13);
    overflow: hidden;
  }
  .hero-chrome {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    background: #17172b;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .hero-url {
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    color: #9aa0b8;
    background: #101020;
    border: 1px solid #23233a;
    border-radius: 999px;
    padding: 5px 16px;
    letter-spacing: 0.4px;
  }
  .hero-url svg { display: block; }
  .hero-shot {
    width: 100%;
    aspect-ratio: 1600 / 1000;
    overflow: hidden;
    background: var(--bg-1);
  }
  .hero-shot img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ===== 5. FUNCIONALIDADES ===== */
  .features {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14.5px;
    font-weight: 600;
    color: #d6d9e8;
    background: rgba(26, 26, 46, 0.78);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 16px 8px;
    white-space: nowrap;
  }
  .chip svg { display: block; }

  /* ===== 6. CTA ===== */
  .cta {
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
    font-size: 23.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #041018;
    background: linear-gradient(94deg, var(--cyan) 0%, var(--blue) 100%);
    border-radius: 999px;
    padding: 19px 46px 18px;
    box-shadow:
      0 10px 34px rgba(0, 212, 255, 0.34),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .cta .arrow { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

  .fineprint {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-faint);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <!-- decoração discreta: candlesticks -->
  <svg class="decor tl" width="150" height="66" viewBox="0 0 150 66" fill="none" aria-hidden="true">
    <line x1="14" y1="8" x2="14" y2="58" stroke="#00e676" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="8" y="20" width="12" height="24" rx="2" fill="#00e676" fill-opacity="0.30"/>
    <line x1="44" y1="2" x2="44" y2="50" stroke="#00e676" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="38" y="12" width="12" height="28" rx="2" fill="#00e676" fill-opacity="0.30"/>
    <line x1="74" y1="12" x2="74" y2="62" stroke="#ff5252" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="68" y="24" width="12" height="26" rx="2" fill="#ff5252" fill-opacity="0.30"/>
    <line x1="104" y1="4" x2="104" y2="52" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="98" y="14" width="12" height="26" rx="2" fill="#00d4ff" fill-opacity="0.30"/>
    <path d="M6 52 L40 34 L72 44 L104 18 L134 26" stroke="#00d4ff" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="decor bl" width="150" height="66" viewBox="0 0 150 66" fill="none" aria-hidden="true">
    <line x1="14" y1="10" x2="14" y2="60" stroke="#00d4ff" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="8" y="22" width="12" height="26" rx="2" fill="#00d4ff" fill-opacity="0.28"/>
    <line x1="44" y1="4" x2="44" y2="54" stroke="#00e676" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="38" y="14" width="12" height="28" rx="2" fill="#00e676" fill-opacity="0.28"/>
    <line x1="74" y1="14" x2="74" y2="64" stroke="#ff5252" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="68" y="26" width="12" height="24" rx="2" fill="#ff5252" fill-opacity="0.28"/>
    <line x1="104" y1="6" x2="104" y2="54" stroke="#00e676" stroke-opacity="0.30" stroke-width="2"/>
    <rect x="98" y="16" width="12" height="26" rx="2" fill="#00e676" fill-opacity="0.28"/>
  </svg>

  <div class="stage">
    <!-- 1. MARCA -->
    <header class="brand">
      <img class="brand-logo" src="assets/logo-venomf.jfif" alt="SP500-site" />
      <div class="brand-name">SP500<span class="site">-site</span></div>
      <div class="brand-tag">DADOS DE MERCADO</div>
    </header>

    <!-- 2. HEADLINE -->
    <h1 class="headline">ACOMPANHE O <span class="accent">S&P 500</span></h1>

    <!-- 3. PROPOSTA DE VALOR -->
    <p class="value-prop">Dados e ferramentas para analisar o mercado, <strong>num só lugar</strong>.</p>

    <!-- 4. PRODUTO — screenshot real do dashboard -->
    <div class="hero">
      <div class="hero-chrome">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="hero-url">
          <svg width="10" height="12" viewBox="0 0 10 12" fill="none" aria-hidden="true">
            <rect x="0.5" y="5" width="9" height="6.5" rx="1.5" stroke="#6f7590"/>
            <path d="M2.5 5V3.5a2.5 2.5 0 0 1 5 0V5" stroke="#6f7590"/>
          </svg>
          SP500 Dashboard
        </span>
      </div>
      <div class="hero-shot">
        <img src="assets/app-dashboard.png" alt="Dashboard SP500-site" />
      </div>
    </div>

    <!-- 5. FUNCIONALIDADES -->
    <div class="features">
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="5.4" height="5.4" rx="1.2" stroke="#00d4ff" stroke-width="1.5"/>
          <rect x="8.6" y="1" width="5.4" height="5.4" rx="1.2" stroke="#00d4ff" stroke-width="1.5"/>
          <rect x="1" y="8.6" width="5.4" height="5.4" rx="1.2" stroke="#00d4ff" stroke-width="1.5"/>
          <rect x="8.6" y="8.6" width="5.4" height="5.4" rx="1.2" stroke="#00d4ff" stroke-width="1.5"/>
        </svg>
        Dashboard
      </span>
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <path d="M7.5 1.4 9.3 5l3.9.5-2.85 2.7.7 3.9L7.5 10.2 3.95 12.1l.7-3.9L1.8 5.5 5.7 5Z" stroke="#00d4ff" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Ação do Dia
      </span>
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="7.6" height="8" rx="1.2" stroke="#00d4ff" stroke-width="1.5"/>
          <rect x="10" y="1" width="4" height="4.6" rx="1" stroke="#00d4ff" stroke-width="1.4"/>
          <rect x="10" y="7" width="4" height="7" rx="1" stroke="#00d4ff" stroke-width="1.4"/>
          <rect x="1" y="10.4" width="7.6" height="3.6" rx="1" stroke="#00d4ff" stroke-width="1.4"/>
        </svg>
        Mapa de Setores
      </span>
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="3.6" height="3.6" rx="0.8" fill="#ff5252" fill-opacity="0.85"/>
          <rect x="5.7" y="1" width="3.6" height="3.6" rx="0.8" fill="#ffab00" fill-opacity="0.85"/>
          <rect x="10.4" y="1" width="3.6" height="3.6" rx="0.8" fill="#00e676" fill-opacity="0.85"/>
          <rect x="1" y="5.7" width="3.6" height="3.6" rx="0.8" fill="#ffab00" fill-opacity="0.85"/>
          <rect x="5.7" y="5.7" width="3.6" height="3.6" rx="0.8" fill="#00e676" fill-opacity="0.85"/>
          <rect x="10.4" y="5.7" width="3.6" height="3.6" rx="0.8" fill="#ff5252" fill-opacity="0.85"/>
          <rect x="1" y="10.4" width="3.6" height="3.6" rx="0.8" fill="#00e676" fill-opacity="0.85"/>
          <rect x="5.7" y="10.4" width="3.6" height="3.6" rx="0.8" fill="#ff5252" fill-opacity="0.85"/>
          <rect x="10.4" y="10.4" width="3.6" height="3.6" rx="0.8" fill="#ffab00" fill-opacity="0.85"/>
        </svg>
        Heatmap
      </span>
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <circle cx="4" cy="4.4" r="2.9" stroke="#00d4ff" stroke-width="1.4"/>
          <circle cx="11" cy="6.4" r="2.1" stroke="#00d4ff" stroke-width="1.3"/>
          <circle cx="6.2" cy="11" r="1.7" stroke="#00d4ff" stroke-width="1.2"/>
        </svg>
        Bubble Chart
      </span>
    </div>

    <!-- 6. CTA -->
    <div class="cta">ACESSE AGORA <span class="arrow">→</span></div>

    <p class="fineprint">Ferramenta informativa. Não constitui aconselhamento financeiro.</p>
  </div>
</body>
</html>
