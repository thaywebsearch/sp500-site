<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP500 Dashboard</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/styles/globals.css">
</head>
<body>
  <div class="app-container">
    <!-- Navegação -->
    <nav class="app-nav">
      <div class="nav-content">
        <h1 class="app-title">📊 SP500 Dashboard</h1>
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="dashboard">📋 Dashboard</button>
          <button class="nav-tab" data-tab="treemap">🗺️ Mapa de Setores</button>
          <button class="nav-tab" data-tab="heatmap">🔥 Heatmap</button>
          <button class="nav-tab" data-tab="bubble">🫧 Bubble Chart</button>
        </div>
      </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <!-- Dashboard View -->
      <div id="dashboard-view" class="dashboard-view">
        <div id="sector-filter"></div>
        <div id="search-input"></div>
        <div id="sort-select"></div>
        <div id="table-body"></div>
        <div id="stats"></div>
        <div id="pagination"></div>
        <div id="header-checkbox"></div>
        <div id="select-all"></div>
        <div id="deselect-all"></div>
        <div id="export-csv"></div>
        <div id="export-json"></div>
      </div>

      <!-- Treemap View -->
      <div id="treemap-view" style="display:none;">
      </div>

      <!-- Heatmap View -->
      <div id="heatmap-view" style="display:none;">
      </div>

      <!-- Bubble Chart View -->
      <div id="bubble-chart-view" style="display:none;">
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/treemap.js"></script>
  <script src="src/heatmap.js"></script>
  <script src="src/bubble-chart.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
