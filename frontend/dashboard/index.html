<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SP500 Dashboard — S&amp;P 500 por Setor, Dividendos e Índices</title>
    <meta
      name="description"
      content="Dashboard interativo do S&P 500: market cap e dividend yield por setor, mapa de setores, inteligência setorial GICS, heatmap, Dow Jones 30, Nasdaq-100, Dividend Kings e Aristocrats. Dados atualizados automaticamente."
    />
    <meta name="theme-color" content="#101018" />
    <link rel="canonical" href="https://thaywebsearch.github.io/sp500-site/frontend/docs/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SP500 Dashboard" />
    <meta property="og:locale" content="pt_PT" />
    <meta
      property="og:title"
      content="SP500 Dashboard — S&amp;P 500 por Setor, Dividendos e Índices"
    />
    <meta
      property="og:description"
      content="Dashboard interativo do S&P 500: market cap e dividend yield por setor, mapa de setores, inteligência setorial GICS, heatmap, Dow Jones 30, Nasdaq-100, Dividend Kings e Aristocrats."
    />
    <meta property="og:url" content="https://thaywebsearch.github.io/sp500-site/frontend/docs/" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="SP500 Dashboard — S&amp;P 500 por Setor, Dividendos e Índices"
    />
    <meta
      name="twitter:description"
      content="Dashboard interativo do S&P 500: market cap e dividend yield por setor, mapa de setores, inteligência setorial GICS, heatmap, Dow Jones 30, Nasdaq-100, Dividend Kings e Aristocrats."
    />

    <link rel="icon" type="image/jpeg" href="./src/assets/VenomF.jfif" />
    <link rel="stylesheet" href="src/styles/globals.css" />
    <link rel="stylesheet" href="src/styles/dashboard.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SP500 Dashboard",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt",
        "description": "Dashboard interativo do S&P 500 com market cap e dividend yield por setor, inteligência setorial GICS, Dow Jones 30, Nasdaq-100, Dividend Kings e Aristocrats.",
        "url": "https://thaywebsearch.github.io/sp500-site/frontend/docs/"
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar para o conteúdo principal</a>
    <div class="app-container">
      <!-- Navegação -->
      <nav class="app-nav">
        <div class="nav-content">
          <div class="nav-header">
            <div class="nav-brand">
              <button
                id="menu-toggle"
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu de navegação"
                aria-expanded="false"
                aria-controls="nav-menu"
              >
                <span class="menu-bars" aria-hidden="true">☰</span>
              </button>
              <h1 class="app-title">
                <img src="./src/assets/VenomF.jfif" alt="" class="app-logo" />
                SP500 Dashboard
              </h1>
            </div>
            <div class="nav-actions">
              <span
                id="freshness-badge"
                class="freshness-badge"
                role="status"
                title="Última atualização dos dados"
              >
                <span class="freshness-dot"></span>
                <span id="freshness-text">Carregando...</span>
              </span>
            </div>
          </div>
          <nav id="nav-menu" class="nav-menu" aria-label="Navegação principal">
            <div class="nav-tabs">
              <div class="nav-group" role="group" aria-label="Geral">
                <span class="nav-group-label">Geral</span>
                <div class="nav-group-tabs">
                  <button class="nav-tab active" data-tab="dashboard">📋 Dashboard</button>
                  <button class="nav-tab" data-tab="daily-curiosity">🌟 Curiosidade do Dia</button>
                  <button class="nav-tab" data-tab="stock-of-day">🎯 Ação do Dia</button>
                </div>
              </div>
              <div class="nav-group" role="group" aria-label="Mercado">
                <span class="nav-group-label">Mercado</span>
                <div class="nav-group-tabs">
                  <button class="nav-tab" data-tab="treemap">🗺️ Mapa de Setores</button>
                  <button class="nav-tab" data-tab="heatmap">🔥 Heatmap</button>
                  <button class="nav-tab" data-tab="bubble">🫧 Bubble Chart</button>
                  <button class="nav-tab" data-tab="sector-intelligence">
                    🧠 Inteligência Setorial
                  </button>
                </div>
              </div>
              <div class="nav-group" role="group" aria-label="Dividendos">
                <span class="nav-group-label">Dividendos</span>
                <div class="nav-group-tabs">
                  <button class="nav-tab" data-tab="dividends">💰 Dividendos</button>
                  <button class="nav-tab" data-tab="dividend-kings">👑 Dividend Kings</button>
                  <button class="nav-tab" data-tab="dividend-aristocrats">
                    🏆 Dividend Aristocrats
                  </button>
                </div>
              </div>
              <div class="nav-group" role="group" aria-label="Índices">
                <span class="nav-group-label">Índices</span>
                <div class="nav-group-tabs">
                  <button class="nav-tab" data-tab="dow-jones">📈 Dow Jones 30</button>
                  <button class="nav-tab" data-tab="nasdaq-100">💻 Nasdaq-100</button>
                </div>
              </div>
            </div>
          </nav>
        </div>
      </nav>

      <!-- Conteúdo Principal -->
      <main id="main-content" class="app-main" tabindex="-1">
        <!-- Dashboard View -->
        <div id="dashboard-view" class="dashboard-view">
          <!-- Resumo do Dia -->
          <section id="daily-summary" class="daily-summary" aria-label="Resumo do dia"></section>

          <!-- Controles -->
          <div class="dashboard-controls">
            <div class="control-group">
              <label for="sector-filter">Setor</label>
              <select id="sector-filter"></select>
            </div>

            <div class="control-group">
              <label for="country-filter">País / Sede</label>
              <select id="country-filter"></select>
            </div>

            <div class="control-group">
              <label for="search-input">Buscar</label>
              <input type="text" id="search-input" placeholder="Símbolo, Empresa, Indústria..." />
            </div>

            <div class="control-group">
              <label for="dividend-min">Div. Yield mín. (%)</label>
              <input type="number" id="dividend-min" min="0" step="0.1" placeholder="Ex: 2" />
            </div>

            <div class="control-group">
              <label for="sort-select">Ordenar por</label>
              <select id="sort-select">
                <option value="symbol-asc">Símbolo (A-Z)</option>
                <option value="name-asc">Empresa (A-Z)</option>
                <option value="marketCap-desc">Market Cap (maior)</option>
                <option value="marketCap-asc">Market Cap (menor)</option>
                <option value="dividendYield-desc">Dividend Yield (%)</option>
              </select>
            </div>
          </div>

          <!-- Botões de Ação -->
          <div class="button-group">
            <button id="select-all">✓ Selecionar Tudo</button>
            <button id="deselect-all">✗ Limpar Seleção</button>
            <button id="export-csv">📥 Exportar CSV</button>
            <button id="export-json">📥 Exportar JSON</button>
          </div>

          <!-- Estatísticas -->
          <div class="stats-box">
            <strong id="stats">Carregando...</strong>
          </div>

          <!-- Tabela -->
          <div class="table-wrapper">
            <table aria-label="Empresas do S&amp;P 500">
              <thead>
                <tr>
                  <th class="col-check" scope="col">
                    <input
                      type="checkbox"
                      id="header-checkbox"
                      aria-label="Selecionar todas as empresas"
                    />
                  </th>
                  <th class="col-index" scope="col">#</th>
                  <th scope="col">Símbolo</th>
                  <th scope="col">Empresa</th>
                  <th scope="col">Setor</th>
                  <th scope="col">Market Cap</th>
                  <th scope="col">Subindústria</th>
                  <th scope="col">Sede</th>
                  <th scope="col">Div. Yield</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <tr>
                  <td colspan="9" class="table-message">Carregando dados...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Paginação -->
          <div id="pagination" class="pagination"></div>
        </div>

        <!-- Curiosidade do Dia View -->
        <div id="daily-curiosity-view" style="display: none"></div>

        <!-- Treemap View -->
        <div id="treemap-view" style="display: none"></div>

        <!-- Heatmap View -->
        <div id="heatmap-view" style="display: none"></div>

        <!-- Bubble Chart View -->
        <div id="bubble-chart-view" style="display: none"></div>

        <!-- Dividendos View -->
        <div id="dividends-view" style="display: none"></div>

        <!-- Ação do Dia View -->
        <div id="stock-of-day-view" style="display: none"></div>

        <!-- Dow Jones 30 View -->
        <div id="dow-jones-view" style="display: none"></div>

        <!-- Dividend Kings View -->
        <div id="dividend-kings-view" style="display: none"></div>

        <!-- Dividend Aristocrats View -->
        <div id="dividend-aristocrats-view" style="display: none"></div>

        <!-- Nasdaq-100 View -->
        <div id="nasdaq-100-view" style="display: none"></div>

        <!-- Inteligência Setorial View -->
        <div id="sector-intelligence-view" style="display: none"></div>
      </main>
    </div>

    <script type="module" src="src/config.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
