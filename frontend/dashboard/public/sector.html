<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP500 Setor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #101018;
      --bg-secondary: #1a1a2e;
      --bg-sidebar: #141422;
      --border: #2a2a3e;
      --text-primary: #e0e0e0;
      --text-secondary: #8888a0;
      --accent-cyan: #00d4ff;
      --accent-green: #00e676;
      --accent-amber: #ffab00;
      --accent-red: #ff5252;
      --sector-accent-rgb: 255, 82, 82;
      --sector-accent-alt-rgb: 255, 107, 53;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-bottom: 40px;
    }

    .back-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .header {
      margin-bottom: 60px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 30px;
    }

    .header-content h1 {
      font-size: 48px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, rgb(var(--sector-accent-alt-rgb)) 0%, rgb(var(--sector-accent-rgb)) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-content p {
      font-size: 16px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(var(--sector-accent-alt-rgb), 0.1) 0%, rgba(var(--sector-accent-rgb), 0.05) 100%);
      border: 1px solid rgba(var(--sector-accent-rgb), 0.2);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: rgb(var(--sector-accent-rgb));
      margin-bottom: 8px;
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .filter-group input,
    .filter-group select {
      padding: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 8px;
      font-size: 14px;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: rgb(var(--sector-accent-rgb));
      box-shadow: 0 0 12px rgba(var(--sector-accent-rgb), 0.2);
    }

    .view-toggle {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }

    .view-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .view-btn:hover {
      border-color: rgb(var(--sector-accent-rgb));
      color: rgb(var(--sector-accent-rgb));
    }

    .view-btn.active {
      background: rgba(var(--sector-accent-rgb), 0.2);
      border-color: rgb(var(--sector-accent-rgb));
      color: rgb(var(--sector-accent-rgb));
    }

    .companies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .company-card {
      background: linear-gradient(135deg, rgba(var(--sector-accent-rgb), 0.05) 0%, rgba(var(--sector-accent-alt-rgb), 0.02) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .company-card:hover {
      border-color: rgb(var(--sector-accent-rgb));
      background: linear-gradient(135deg, rgba(var(--sector-accent-rgb), 0.1) 0%, rgba(var(--sector-accent-alt-rgb), 0.05) 100%);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(var(--sector-accent-rgb), 0.15);
    }

    .company-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .company-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .company-symbol {
      font-size: 12px;
      background: rgba(var(--sector-accent-rgb), 0.2);
      color: rgb(var(--sector-accent-rgb));
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .company-subinfo {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .company-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric {
      background: rgba(var(--sector-accent-rgb), 0.05);
      border: 1px solid rgba(var(--sector-accent-rgb), 0.1);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: rgb(var(--sector-accent-rgb));
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .companies-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: none;
    }

    .companies-table.active {
      display: table;
    }

    .companies-table th {
      background: rgba(var(--sector-accent-rgb), 0.1);
      color: rgb(var(--sector-accent-rgb));
      padding: 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
    }

    .companies-table th:hover {
      background: rgba(var(--sector-accent-rgb), 0.15);
    }

    .companies-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .companies-table tr:hover {
      background: rgba(var(--sector-accent-rgb), 0.05);
    }

    .companies-table tr:last-child td {
      border-bottom: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .info-box {
      background: rgba(var(--sector-accent-rgb), 0.05);
      border-left: 4px solid rgb(var(--sector-accent-rgb));
      padding: 20px;
      border-radius: 8px;
      margin-top: 40px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .info-box strong {
      color: rgb(var(--sector-accent-rgb));
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
      }

      .header-content h1 {
        font-size: 32px;
      }

      .companies-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-btn" onclick="goBack()">← Voltar ao Mapa de Setores</button>

    <div class="header">
      <div class="header-content">
        <h1 id="sector-name">Setor</h1>
        <p id="sector-subtitle"></p>
      </div>
      <div class="header-stats">
        <div class="stat-card">
          <div class="value" id="total-companies">0</div>
          <div class="label">Empresas</div>
        </div>
        <div class="stat-card">
          <div class="value" id="total-market-cap">$0B</div>
          <div class="label">Market Cap Total</div>
        </div>
        <div class="stat-card">
          <div class="value" id="avg-dividend">0%</div>
          <div class="label">Dividendo Médio</div>
        </div>
      </div>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label for="search">Buscar por Nome ou Símbolo</label>
        <input type="text" id="search" placeholder="Buscar...">
      </div>
      <div class="filter-group">
        <label for="sort">Ordenar por</label>
        <select id="sort">
          <option value="symbol">Símbolo (A-Z)</option>
          <option value="name">Nome (A-Z)</option>
          <option value="marketcap">Market Cap (maior)</option>
          <option value="dividend">Dividend Yield (maior)</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="min-dividend">Dividend Mínimo (%)</label>
        <input type="number" id="min-dividend" placeholder="Ex: 2.5" min="0" step="0.1">
      </div>
    </div>

    <div class="view-toggle">
      <button class="view-btn active" onclick="switchView('cards')">🃏 Cards</button>
      <button class="view-btn" onclick="switchView('table')">📊 Tabela</button>
    </div>

    <div id="loading" class="loading">Carregando empresas...</div>

    <div id="cards-view" class="companies-grid" style="display: none;"></div>

    <table id="table-view" class="companies-table">
      <thead>
        <tr>
          <th onclick="sortTable('symbol')">Símbolo</th>
          <th onclick="sortTable('name')">Empresa</th>
          <th onclick="sortTable('subindustry')">Subindústria</th>
          <th onclick="sortTable('headquarters')">Sede</th>
          <th onclick="sortTable('marketcap')">Market Cap</th>
          <th onclick="sortTable('dividend')">Dividend Yield</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <div class="info-box">
      <strong id="info-title">💡 Sobre o setor:</strong> <span id="info-text"></span>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:5001'
      : 'https://sp500-site-production.up.railway.app';

    const SECTORS_CONFIG = {
      'communication-services': {
        name: 'Communication Services',
        subtitle: '📡 Serviços de Comunicação - Telecomunicações, Media e Internet',
        placeholder: 'Ex: Google, GOOGL...',
        info: 'Este setor inclui empresas de telecomunicações, serviços de internet, media e entretenimento. Inclui gigantes globais de tecnologia, operadoras de telecomunicações e plataformas de conteúdo. Estas empresas frequentemente apresentam dividendos estáveis e estão na vanguarda da transformação digital.',
        accent: '#00e676',
        accentLight: '#00d4ff',
      },
      'consumer-discretionary': {
        name: 'Consumer Discretionary',
        subtitle: '🛍️ Bens de Consumo Discricionários - Varejo, Automóvel e Lazer',
        placeholder: 'Ex: Amazon, AMZN...',
        info: 'Este setor inclui empresas que produzem e vendem bens e serviços discricionários - produtos que os consumidores compram quando têm renda disponível. Inclui varejo, automóvel, lazer e entretenimento. Estas empresas tendem a ser mais sensíveis aos ciclos económicos, aumentando em tempos de crescimento.',
        accent: '#ffab00',
        accentLight: '#ff9800',
      },
      'consumer-staples': {
        name: 'Consumer Staples',
        subtitle: '🛒 Produtos de Consumo Essenciais - Bens de primeira necessidade',
        placeholder: 'Ex: Walmart, WMT...',
        info: 'Este setor inclui empresas que produzem e distribuem produtos de consumo essenciais, como alimentos, bebidas, produtos de higiene e limpeza. Estas empresas tendem a ter receitas mais previsíveis e resistentes a crises económicas, sendo frequentemente escolhidas por investidores defensivos.',
        accent: '#00d4ff',
        accentLight: '#00e676',
      },
      energy: {
        name: 'Energy',
        subtitle: '⚡ Energia - Petróleo, Gás, Energia Renovável e Utilidades',
        placeholder: 'Ex: ExxonMobil, XOM...',
        info: 'Este setor inclui empresas envolvidas na produção, exploração e distribuição de energia. Compreende empresas de petróleo e gás, bem como produtores de energia renovável e utilities. Estas empresas são fundamentais para a economia global e historicamente oferecem rendimentos elevados através de dividendos.',
        accent: '#ff5252',
        accentLight: '#ff6b35',
      },
      financials: {
        name: 'Financials',
        subtitle: '💳 Setor Financeiro - Bancos, Seguradoras e Serviços Financeiros',
        placeholder: 'Ex: JPMorgan, JPM...',
        info: 'Este setor abrange instituições financeiras, incluindo bancos, seguradoras, corretoras e outros serviços financeiros. É um dos setores mais importantes da economia global, facilitando o fluxo de capital e gerindo riscos. Historicamente oferece dividendos substanciais e é cíclico, respondendo às taxas de juro e condições económicas.',
        accent: '#ab47bc',
        accentLight: '#ba68c8',
      },
      'health-care': {
        name: 'Health Care',
        subtitle: '🏥 Saúde e Cuidados - Farmacêuticas, Dispositivos Médicos e Serviços',
        placeholder: 'Ex: Johnson & Johnson, JNJ...',
        info: 'Este setor abrange empresas farmacêuticas, fabricantes de dispositivos médicos, operadores de seguros de saúde e prestadores de cuidados de saúde. É um setor resistente a ciclos económicos, impulsionado pela procura constante de produtos e serviços de saúde. Oferece frequentemente crescimento e dividendos estáveis.',
        accent: '#26a69a',
        accentLight: '#29b6f6',
      },
      industrials: {
        name: 'Industrials',
        subtitle: '🏭 Indústria - Manufatura, Construção, Defesa e Transportes',
        placeholder: 'Ex: Boeing, BA...',
        info: 'Este setor compreende empresas envolvidas em manufatura, construção, equipamentos agrícolas, defesa, aeroespacial e transportes. Inclui alguns dos maiores fabricantes e fornecedores de infraestrutura do mundo. Este setor é cíclico e responde a investimento em capital e crescimento económico.',
        accent: '#fb8c00',
        accentLight: '#ffa726',
      },
      'information-technology': {
        name: 'Information Technology',
        subtitle: '💻 Tecnologia - Software, Hardware, Semiconductores e Internet',
        placeholder: 'Ex: Apple, AAPL...',
        info: 'Este é o maior e mais dinâmico setor do S&P 500, incluindo gigantes da computação, software, semicondutores e serviços de internet. Abrange desde startups inovadoras até mega-corporations dominantes globalmente. O setor é impulsionado pela inovação contínua, transformação digital e crescimento exponencial em áreas como IA, cloud computing e cibersegurança.',
        accent: '#00bcd4',
        accentLight: '#00d4ff',
      },
      materials: {
        name: 'Materials',
        subtitle: '⛏️ Materiais - Mineração, Químicos e Produção de Matérias-Primas',
        placeholder: 'Ex: DuPont, DD...',
        info: 'Este setor compreende empresas envolvidas na extração, processamento e produção de matérias-primas essenciais para a economia global. Inclui mineração de metais preciosos e industriais, produção química e transformação de commodities. É um setor cíclico sensível aos preços das commodities e ao crescimento económico global.',
        accent: '#43a047',
        accentLight: '#66bb6a',
      },
      'real-estate': {
        name: 'Real Estate',
        subtitle: '🏢 Imobiliário - REITs, Desenvolvimento Imobiliário e Gestão de Propriedades',
        placeholder: 'Ex: REIT Corp, REIT...',
        info: 'Este setor compreende fundos de investimento imobiliário (REITs), empresas de desenvolvimento imobiliário e proprietários de propriedades comerciais. Os REITs são obrigados a distribuir 90% dos seus lucros aos investidores, oferecendo tipicamente rendimentos elevados. É um setor defensivo com fluxos de caixa previsíveis e exposição à inflação.',
        accent: '#d81b60',
        accentLight: '#ec407a',
      },
      utilities: {
        name: 'Utilities',
        subtitle: '⚡ Serviços Públicos Essenciais - Eletricidade, Gás e Água',
        placeholder: 'Ex: NextEra, NEE...',
        info: 'Este setor inclui empresas que fornecem serviços públicos essenciais como eletricidade, gás natural e água. Estas empresas operam frequentemente em regime de monopólio regulado, gerando receitas previsíveis e estáveis. É um setor defensivo, muito procurado por investidores focados em dividendos consistentes e baixa volatilidade.',
        accent: '#00897b',
        accentLight: '#26a69a',
      },
    };

    const SECTOR_ID = new URLSearchParams(window.location.search).get('sector') || '';
    const CONFIG = SECTORS_CONFIG[SECTOR_ID] || null;

    let allCompanies = [];
    let filteredCompanies = [];
    let currentView = 'cards';
    let sortBy = 'symbol';

    function hexToRgb(hex) {
      const value = hex.replace('#', '');
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `${r}, ${g}, ${b}`;
    }

    function applyConfig() {
      if (!CONFIG) return;
      const root = document.documentElement.style;
      root.setProperty('--sector-accent-rgb', hexToRgb(CONFIG.accent));
      root.setProperty('--sector-accent-alt-rgb', hexToRgb(CONFIG.accentLight));
      document.title = `${CONFIG.name} - SP500 Setor`;
      document.getElementById('sector-name').textContent = CONFIG.name;
      document.getElementById('sector-subtitle').textContent = CONFIG.subtitle;
      document.getElementById('search').placeholder = CONFIG.placeholder;
      document.getElementById('loading').textContent = `Carregando empresas de ${CONFIG.name}...`;
      document.getElementById('info-title').textContent = `💡 Sobre ${CONFIG.name}:`;
      document.getElementById('info-text').textContent = CONFIG.info;
    }

    window.addEventListener('load', () => {
      applyConfig();
      if (!CONFIG) {
        document.getElementById('loading').innerHTML = `
          <div style="color: var(--accent-red); font-size: 16px;">
            ❌ Setor não especificado ou desconhecido
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 10px;">
              Volte ao mapa de setores e escolha um setor.
            </div>
          </div>
        `;
        return;
      }
      loadSectorData();
    });

    async function loadSectorData() {
      try {
        console.log(`Carregando dados de ${SECTOR_ID}...`);
        const response = await fetch(`${API_BASE_URL}/api/setor/${SECTOR_ID}`);
        const data = await response.json();

        if (data.dados && data.dados.companies) {
          allCompanies = data.dados.companies;
          document.getElementById('loading').style.display = 'none';
          document.getElementById('cards-view').style.display = 'grid';
          filterAndRender();
          updateStats();
        } else {
          throw new Error('Dados inválidos recebidos da API');
        }
      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: var(--accent-red); font-size: 16px;">
            ❌ Erro ao carregar empresas de ${CONFIG.name}
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 10px;">
              ${error.message}
            </div>
          </div>
        `;
      }
    }

    function filterAndRender() {
      const search = document.getElementById('search').value.toLowerCase();
      const minDividend = parseFloat(document.getElementById('min-dividend').value) || 0;

      filteredCompanies = allCompanies.filter(company => {
        const matchesSearch = !search ||
          company.symbol.toLowerCase().includes(search) ||
          company.name.toLowerCase().includes(search);

        const matchesDividend = (company.dividendYield || 0) >= minDividend;

        return matchesSearch && matchesDividend;
      });

      sortCompanies();
      renderView();
    }

    function sortCompanies() {
      filteredCompanies.sort((a, b) => {
        switch (sortBy) {
          case 'symbol':
            return a.symbol.localeCompare(b.symbol);
          case 'name':
            return a.name.localeCompare(b.name);
          case 'marketcap':
            return (b.marketCap || 0) - (a.marketCap || 0);
          case 'dividend':
            return (b.dividendYield || 0) - (a.dividendYield || 0);
          case 'subindustry':
            return (a.subIndustry || '').localeCompare(b.subIndustry || '');
          case 'headquarters':
            return (a.headquarters || '').localeCompare(b.headquarters || '');
          default:
            return 0;
        }
      });
    }

    function renderView() {
      if (currentView === 'cards') {
        renderCards();
      } else {
        renderTable();
      }
    }

    function renderCards() {
      const container = document.getElementById('cards-view');
      container.innerHTML = filteredCompanies.map(company => `
        <div class="company-card">
          <div class="company-header">
            <div>
              <div class="company-name">${company.name}</div>
              <div class="company-subinfo">${company.subIndustry || 'N/A'}</div>
            </div>
            <div class="company-symbol">${company.symbol}</div>
          </div>

          <div class="company-metrics">
            <div class="metric">
              <div class="metric-value">$${(company.marketCap / 1e9).toFixed(1)}B</div>
              <div class="metric-label">Market Cap</div>
            </div>
            <div class="metric">
              <div class="metric-value">${(company.dividendYield || 0).toFixed(2)}%</div>
              <div class="metric-label">Dividend</div>
            </div>
          </div>

          <div style="font-size: 11px; color: var(--text-secondary); border-top: 1px solid rgba(var(--sector-accent-rgb), 0.1); padding-top: 12px;">
            📍 ${company.headquarters || 'N/A'}
          </div>
        </div>
      `).join('');
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = filteredCompanies.map(company => `
        <tr>
          <td><strong>${company.symbol}</strong></td>
          <td>${company.name}</td>
          <td>${company.subIndustry || 'N/A'}</td>
          <td>${company.headquarters || 'N/A'}</td>
          <td>$${(company.marketCap / 1e9).toFixed(2)}B</td>
          <td><strong style="color: var(--accent-green)">${(company.dividendYield || 0).toFixed(2)}%</strong></td>
        </tr>
      `).join('');
    }

    function updateStats() {
      const totalCap = allCompanies.reduce((sum, c) => sum + (c.marketCap || 0), 0);
      const avgDiv = allCompanies.length > 0
        ? allCompanies.reduce((sum, c) => sum + (c.dividendYield || 0), 0) / allCompanies.length
        : 0;

      document.getElementById('total-companies').textContent = allCompanies.length;
      document.getElementById('total-market-cap').textContent = `$${(totalCap / 1e9).toFixed(1)}B`;
      document.getElementById('avg-dividend').textContent = avgDiv.toFixed(2) + '%';
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('cards-view').style.display = view === 'cards' ? 'grid' : 'none';
      document.getElementById('table-view').classList.toggle('active');
    }

    function sortTable(column) {
      sortBy = column;
      sortCompanies();
      renderView();
    }

    function goBack() {
      window.location.href = new URL('index.html#treemap', document.baseURI).href;
    }

    // Event Listeners
    document.getElementById('search').addEventListener('input', filterAndRender);
    document.getElementById('sort').addEventListener('change', (e) => {
      sortBy = e.target.value;
      sortCompanies();
      renderView();
    });
    document.getElementById('min-dividend').addEventListener('input', filterAndRender);
  </script>
</body>
</html>
