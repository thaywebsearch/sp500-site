name: Build do Dashboard

on:
  push:
    branches: [main]
    paths:
      - "frontend/dashboard/**"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Instalar dependências
        working-directory: frontend/dashboard
        run: npm ci

      - name: Lint
        working-directory: frontend/dashboard
        run: npm run lint

      - name: Verificação de formatação
        working-directory: frontend/dashboard
        run: npm run format:check

      - name: Testes
        working-directory: frontend/dashboard
        run: npm test

      - name: Build (gera ../docs)
        working-directory: frontend/dashboard
        run: npm run build

      - name: Commit e push das mudanças em docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet frontend/docs; then
            echo "Sem mudanças em docs/ — nada a commitar."
          else
            git add frontend/docs
            git commit -m "chore: rebuild dashboard docs (${{ github.run_id }})"
            git push
          fi
