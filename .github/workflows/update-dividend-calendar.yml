name: Atualização diária do Calendário de Dividendos (S&P 500)

on:
  schedule:
    # Diariamente às 21:40 UTC (após o fechamento do mercado dos EUA)
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Executar script do Calendário de Dividendos
        run: python scripts/update_dividend_calendar.py --once --symbols 1
        continue-on-error: false

      - name: Verificar mudanças
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nenhuma mudança detectada."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Mudanças detectadas — commitando..."
          fi

      - name: Commit e push das mudanças
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: atualização do Calendário de Dividendos (${{ github.run_id }})"
          git push

      - name: Resumo da execução
        run: |
          echo "## Calendário de Dividendos" >> $GITHUB_STEP_SUMMARY
          echo "- **Data**: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "- **Status**: ✅ Calendário atualizado e commitado" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ℹ️ Nenhuma mudança no calendário" >> $GITHUB_STEP_SUMMARY
          fi
