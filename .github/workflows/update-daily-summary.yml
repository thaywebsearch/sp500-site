name: Atualização Diária do Resumo do Dia (S&P 500)

on:
  schedule:
    # Diariamente às 21:30 UTC (após o fechamento do mercado dos EUA)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Executar script do Resumo do Dia
        run: python scripts/update_daily_summary.py

      - name: Verificar mudanças
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nenhuma mudança detectada."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Mudanças detectadas — commitando..."
          fi

      - name: Commit e push das mudanças
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: atualização diária do Resumo do Dia (${{ github.run_id }})"
          git push

      - name: Resumo da execução
        run: |
          echo "## Resumo do Dia" >> $GITHUB_STEP_SUMMARY
          echo "- **Data**: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "- **Status**: ✅ Resumo atualizado e commitado" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ℹ️ Nenhuma mudança no resumo" >> $GITHUB_STEP_SUMMARY
          fi

  # Falhas deixam de ser silenciosas: abre uma issue (ou comenta na existente)
  # com o link da execução. Requer "Read and write permissions" em
  # Settings > Actions > General > Workflow permissions.
  report-failure:
    needs: update
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir ou atualizar issue de falha
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `[dados] Falha em ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const corpo = [
              `O workflow **${context.workflow}** falhou.`,
              '',
              `- Execução: ${runUrl}`,
              `- Evento: ${context.eventName}`,
              `- Commit: ${context.sha}`,
            ].join('\n');

            const { data: abertas } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update-failure',
              per_page: 100,
            });
            const existente = abertas.find((i) => i.title === titulo);

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: `Nova falha.\n\n${corpo}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ['data-update-failure'],
              });
            }