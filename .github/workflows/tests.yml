name: Testes (Python)

on:
  push:
    paths:
      - "frontend/scripts/**"
      - "frontend/tests/**"
      - "frontend/*/*.json"
      - "!frontend/docs/**"
      - "!frontend/dashboard/**"
      - "backend/data/**"
      - "backend/scripts/**"
      - "frontend/requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "frontend/scripts/**"
      - "frontend/tests/**"
      - "frontend/*/*.json"
      - "!frontend/docs/**"
      - "!frontend/dashboard/**"
      - "backend/data/**"
      - "backend/scripts/**"
      - "frontend/requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Verificar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: frontend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes (unittest) e verificação de integridade
        run: python -m unittest discover -s tests -v

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validar dados estáticos do dashboard
        working-directory: ${{ github.workspace }}
        run: node frontend/dashboard/scripts/validate-static-data.mjs

      - name: Validar snapshot único (schema + hash + frescor)
        working-directory: ${{ github.workspace }}/backend
        run: node scripts/build-snapshot.mjs --check
