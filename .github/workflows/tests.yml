name: Testes (Python)

on:
  push:
    paths:
      - "frontend/scripts/**"
      - "frontend/tests/**"
      - "frontend/*/*.json"
      - "!frontend/docs/**"
      - "!frontend/dashboard/**"
      - "backend/data/**"
      - "frontend/requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "frontend/scripts/**"
      - "frontend/tests/**"
      - "frontend/*/*.json"
      - "!frontend/docs/**"
      - "!frontend/dashboard/**"
      - "backend/data/**"
      - "frontend/requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Verificar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: frontend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes (unittest) e verificação de integridade
        run: python -m unittest discover -s tests -v
