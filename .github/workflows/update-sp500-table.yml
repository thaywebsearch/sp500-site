name: Atualizar Tabela S&P 500

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    permissions:
      contents: write

    steps:
      - name: Verificar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas tabulate

      - name: Executar script de atualização
        run: python update_sp500.py

      - name: Commit e push das mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sp500-table/
          git diff --staged --quiet || git commit -m "chore: atualização semanal da tabela S&P 500 (${{ github.run_id }})"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Falhas deixam de ser silenciosas: abre uma issue (ou comenta na existente)
  # com o link da execução. Requer "Read and write permissions" em
  # Settings > Actions > General > Workflow permissions.
  report-failure:
    needs: atualizar
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir ou atualizar issue de falha
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `[dados] Falha em ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const corpo = [
              `O workflow **${context.workflow}** falhou.`,
              '',
              `- Execução: ${runUrl}`,
              `- Evento: ${context.eventName}`,
              `- Commit: ${context.sha}`,
            ].join('\n');

            const { data: abertas } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-update-failure',
              per_page: 100,
            });
            const existente = abertas.find((i) => i.title === titulo);

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: `Nova falha.\n\n${corpo}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ['data-update-failure'],
              });
            }
