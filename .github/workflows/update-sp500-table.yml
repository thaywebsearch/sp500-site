name: Atualizar Tabela S&P 500

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    permissions:
      contents: write

    steps:
      - name: Verificar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas tabulate

      - name: Executar script de atualização
        run: python update_sp500.py

      - name: Commit e push das mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sp500-table/
          git diff --staged --quiet || git commit -m "chore: atualização semanal da tabela S&P 500 (${{ github.run_id }})"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
